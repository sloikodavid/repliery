name: E2E
run-name: E2E · ${{ github.ref_name }} · ${{ github.event_name == 'push' && 'chromium' || inputs.browser || 'all browsers' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        required: true
        default: all
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}-${{ inputs.browser || 'automatic' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

jobs:
  test:
    name: ${{ matrix.browser }} · ${{ matrix.platform.label }}
    env:
      E2E_CLERK_USER_EMAIL: e2e+clerk_test_${{ github.run_id }}_${{ matrix.browser }}_${{ matrix.platform.label }}@example.com
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'push' && '["chromium"]' || github.event_name == 'workflow_dispatch' && inputs.browser != 'all' && format('["{0}"]', inputs.browser) || '["chromium","firefox","webkit"]') }}
        platform:
          - label: linux
            os: ubuntu-24.04
          - label: macos
            os: macos-15
          - label: windows
            os: windows-2025
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os != 'Linux'
        run: pnpm exec playwright install ${{ matrix.browser }}
      - name: Run the authenticated main-branch journey
        if: github.event_name == 'push'
        run: pnpm run test:e2e -- --project=authenticated-${{ matrix.browser }}
      - name: Run the selected desktop projects
        if: github.event_name != 'push' && matrix.browser != 'webkit'
        run: pnpm run test:e2e -- --project=public-${{ matrix.browser }} --project=authenticated-${{ matrix.browser }}
      - name: Run the selected WebKit projects
        if: github.event_name != 'push' && matrix.browser == 'webkit'
        run: pnpm run test:e2e -- --project=public-webkit --project=public-mobile-webkit --project=authenticated-webkit
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          if-no-files-found: ignore
          name: e2e-${{ matrix.browser }}-${{ matrix.platform.label }}-${{ github.run_attempt }}
          path: test/.artifacts/playwright
          retention-days: 3

  verify:
    name: Verify
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm every browser job passed
        if: needs.test.result != 'success'
        run: exit 1
      - run: echo "Every selected browser job passed."
